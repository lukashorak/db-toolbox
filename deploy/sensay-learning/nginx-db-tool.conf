# nginx site for Database Workbench at https://db-tool.sensay-learning.com
# Install: copy to /etc/nginx/sites-available/db-tool.sensay-learning.com, link it into
# sites-enabled, get the certificate (certbot certonly --nginx -d db-tool.sensay-learning.com),
# then: nginx -t && systemctl reload nginx
#
# The workbench listens on 127.0.0.1:3000 (compose.yaml publishes it on loopback only).

server {
    listen 80;
    listen [::]:80;
    server_name db-tool.sensay-learning.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 or newer; on older versions write "listen 443 ssl http2;" instead.
    http2 on;
    server_name db-tool.sensay-learning.com;

    ssl_certificate     /etc/letsencrypt/live/db-tool.sensay-learning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db-tool.sensay-learning.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Long SQL scripts are sent as JSON; result data never travels in requests.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: the workbench trusts this header (TRUST_PROXY=true) and limits
        # rejected sign-ins per client address, so a client must not be able to choose it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Live status (/api/v1/events) and MCP (/mcp) stream their responses: no buffering, and
        # read timeouts longer than an event stream lives (it ends when the 5-minute token expires).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;

        # The app sends its own security headers (CSP, HSTS, X-Frame-Options, ...); do not add or
        # replace them here.
    }
}
