# Database Workbench for Dockge (or plain `docker compose`).
# Put this file and a filled-in .env (from .env.example) in one stack folder, then:
#   mkdir -p data exports && sudo chown 1000:1000 data exports && chmod 700 data exports
#   docker compose up -d
# See docs/operations.md for the reverse proxy, Keycloak, backups and upgrades.
name: database-workbench

services:
  workbench:
    image: ${WORKBENCH_IMAGE:-database-workbench:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      EXPORT_DIR: /exports
    # Published on loopback only: the reverse proxy on the same host terminates HTTPS.
    ports:
      - '${WORKBENCH_BIND:-127.0.0.1}:${WORKBENCH_PORT:-3000}:3000'
    volumes:
      # Application database (SQLite) and captured results. Back up with the CLI, not by copying.
      - ./data:/data
      # Export files; they can be regenerated from captured results while those are retained.
      - ./exports:/exports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # More than SHUTDOWN_GRACE_MS (20 s by default), so running executions can finish.
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
